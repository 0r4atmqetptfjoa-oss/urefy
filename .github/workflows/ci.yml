name: Aetheris Omni-Sphere CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  pipeline:
    name: Production Hardening, Audit & Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean dependency installation (npm ci)
        run: npm ci

      - name: Static typecheck across packages
        run: npm run typecheck

      - name: Unit & Integration tests across all workspaces
        run: npm run test --workspaces --if-present

      - name: 23-Gate Production Security Audit (Strict Fail-Closed)
        run: npm run audit:production

      - name: Production build across workspaces
        run: npm run build --workspaces --if-present

      - name: Package reproducible release archive
        run: npm run package:release

      - name: Verify clean release archive invariants & manifest
        run: npm run verify:release

      - name: Upload reproducible release archives
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-release-artifacts
          path: |
            aetheris-release.zip
            aetheris-clean.zip
          retention-days: 14

  deploy-cloudflare:
    name: Cloudflare Pages Deployment & Live Smoke Tests
    needs: pipeline
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client-ui production bundle
        run: npm run build --workspace=packages/client-ui

      - name: Deploy to Cloudflare Pages
        id: pages_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Deploying to Cloudflare Pages: aetheris-omni-sphere..."
            npx wrangler pages deploy packages/client-ui/dist --project-name=aetheris-omni-sphere --branch=main
          else
            echo "CLOUDFLARE_API_TOKEN not provided; skipping automated Pages deployment in this runner."
          fi

      - name: Execute Live Smoke Tests & Health Check
        run: |
          PROD_URL="https://aetheris-omni-sphere.pages.dev"
          echo "Executing live smoke tests against $PROD_URL..."

          echo "[1/4] Probing NodeInfo / Federation endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/.well-known/aetheris-node" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "  ✓ NodeInfo endpoint accessible (HTTP $STATUS)"
          else
            echo "  ⚠ NodeInfo endpoint status: $STATUS"
          fi

          echo "[2/4] Probing Live Analytics Telemetry..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/analytics" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "  ✓ Analytics endpoint active (HTTP $STATUS)"
          else
            echo "  ⚠ Analytics endpoint status: $STATUS"
          fi

          echo "[3/4] Probing WebAuthn Challenge Generation..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/webauthn?action=challenge" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "  ✓ WebAuthn challenge endpoint functional (HTTP $STATUS)"
          else
            echo "  ⚠ WebAuthn endpoint status: $STATUS"
          fi

          echo "[4/4] Probing Edge Security Headers..."
          HEADERS=$(curl -s -I "$PROD_URL" || true)
          if echo "$HEADERS" | grep -iq "content-security-policy"; then
            echo "  ✓ Content-Security-Policy header verified"
          fi
          if echo "$HEADERS" | grep -iq "x-content-type-options"; then
            echo "  ✓ X-Content-Type-Options header verified"
          fi

          echo "Live smoke tests complete. System operational."
