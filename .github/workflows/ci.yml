name: UREfy CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  pipeline:
    name: Production Hardening, Audit & Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Clean dependency installation (npm ci)
        run: npm ci

      - name: Static typecheck across packages
        run: npm run typecheck

      - name: Unit & Integration tests across all workspaces
        run: npm test

      - name: Production build across workspaces
        run: npm run build

      - name: Verify reproducible production build
        run: npm run verify:reproducible

      - name: Transitive startup bundle budget
        run: npm run audit:bundle

      - name: Production Security Audit (Strict Fail-Closed)
        run: npm run audit:production

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Workspace desktop and mobile browser regressions
        working-directory: packages/client-ui
        env:
          PLAYWRIGHT_PREVIEW: '1'
        run: npm run test:e2e -- premium-workspace.spec.ts functional-controls.spec.ts push-banner.spec.ts private-messaging.spec.ts governance-live.spec.ts pwa-runtime.spec.ts brand-release.spec.ts webrtc-live.spec.ts --project=chromium

      - name: Package reproducible release archive
        run: npm run package:release

      - name: Verify clean release archive invariants & manifest
        run: npm run verify:release

      - name: Upload reproducible release archives
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-release-artifacts
          path: |
            aetheris-release.zip
            aetheris-clean.zip
          retention-days: 14

  deploy-cloudflare:
    name: Cloudflare Pages Deployment & Live Smoke Tests
    needs: pipeline
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client-ui production bundle
        run: npm run build:shared && npm run build --workspace=packages/client-ui

      - name: Deploy to Cloudflare Pages
        id: pages_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Deploying to Cloudflare Pages: aetheris-omni-sphere..."
            npx wrangler pages deploy packages/client-ui/dist --project-name=aetheris-omni-sphere --branch=main
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLOUDFLARE_API_TOKEN not provided; skipping automated Pages deployment in this runner."
          fi

      - name: Execute Live Smoke Tests & Health Check
        if: steps.pages_deploy.outputs.deployed == 'true'
        env:
          SMOKE_BASE_URL: https://aetheris-omni-sphere.pages.dev
        run: node scripts/smoke-test.mjs

      - name: Execute opt-in multi-node and Fediverse interoperability checks
        if: steps.pages_deploy.outputs.deployed == 'true' && secrets.UREFY_SECONDARY_NODE_URL != ''
        env:
          UREFY_NODE_URLS: https://aetheris-omni-sphere.pages.dev,${{ secrets.UREFY_SECONDARY_NODE_URL }}
          FEDIVERSE_TEST_HANDLE: ${{ secrets.FEDIVERSE_TEST_HANDLE }}
        run: npm run test:live-network
