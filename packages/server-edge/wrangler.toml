name = "aetheris-edge-relay"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

# Cloudflare D1 SQL Database Binding
[[d1_databases]]
binding = "DB"
database_name = "aetheris-global-d1"
database_id = "aetheris-production-db-id"

# Cloudflare Durable Objects Binding for WebSocket Hibernation Relay
[durable_objects]
bindings = [
  { name = "RELAY_DO", class_name = "RelayDurableObject" }
]

[[migrations]]
tag = "v1"
new_classes = ["RelayDurableObject"]
