name = "aetheris-edge-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[vars]
ENVIRONMENT = "production"

# Cloudflare D1 SQL Database Binding
[[d1_databases]]
binding = "DB"
database_name = "aetheris-db"
database_id = "1db6fb06-52af-4e09-87ba-28e862bb651f"

# Cloudflare Durable Objects Binding for WebSocket Hibernation Relay
[durable_objects]
bindings = [
  { name = "RELAY_DO", class_name = "RelayDurableObject" }
]

# Cloudflare R2 Storage Bucket for D1 Backups
[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "aetheris-storage"

# Automated Scheduled Cron Trigger (Daily at 03:00 UTC)
[triggers]
crons = ["0 3 * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]
