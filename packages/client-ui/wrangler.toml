name = "aetheris-omni-sphere"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
APP_NAME = "UREfy"
AWS_REGION = "eu-central-1"
AWS_S3_BUCKET = "urefy-dr-backups-20260929-eucentral1-7k2p"
AWS_FULL_DR_ENABLED = "true"
AWS_SQS_QUEUE_URL = "https://sqs.eu-central-1.amazonaws.com/579505322330/urefy-async-jobs"
MAX_STORAGE_CAP_BYTES = "8589934592" # 8.0 GB safe storage ceiling
MAX_UPLOAD_BYTES = "26214400" # 25 MiB per file, checked by the upload API
MAX_ACCOUNT_STORAGE_BYTES = "104857600" # 100 MiB per account, reserved atomically in D1
MAX_BINARY_SCAN_BYTES = "26214400" # 25 MB max edge binary scan limit

# Cloudflare Durable Object Binding (points to server-edge relay worker)
[[durable_objects.bindings]]
name = "RELAY_DO"
class_name = "RelayDurableObject"
script_name = "aetheris-edge-relay"

# Cloudflare D1 SQL Database Binding (functions/api/_db.ts -> env.DB / env.AETHERIS_DB)
[[d1_databases]]
binding = "DB"
database_name = "aetheris-db"
database_id = "1db6fb06-52af-4e09-87ba-28e862bb651f"

# Cloudflare KV Cache Binding (functions/api/_db.ts -> env.KV / env.CACHE_KV)
[[kv_namespaces]]
binding = "KV"
id = "719669b69e5d409ab5401d6b26952706"

# Cloudflare R2 Storage Buckets (functions/api/_db.ts -> env.STORAGE_BUCKET / env.VAULT_BUCKET)
[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "aetheris-storage"

[[r2_buckets]]
binding = "VAULT_BUCKET"
bucket_name = "aetheris-vault"
