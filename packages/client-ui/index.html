    <!-- ─── ANTI-FOUC THEME SYNCHRONIZATION & CRAWLER SHELL STYLES ─── -->
    <script>
      (function(){
        try {
          var savedLang = localStorage.getItem('aetheris_locale');
          if (savedLang) {
            document.documentElement.lang = savedLang;
            if (savedLang === 'ar') document.documentElement.dir = 'rtl';
          }
          var raw = localStorage.getItem('aetheris_theme_pref');
          var t = 'solar-amber';
          if (raw) {
            try {
              var parsed = JSON.parse(raw);
              if (parsed && (parsed.themeId || parsed.activeThemeId)) t = parsed.themeId || parsed.activeThemeId;
            } catch (_) { if (typeof raw === 'string') t = raw; }
          }
          var bgMap = {
            'alabaster-light': '#f8fafc',
            'matrix-monolith': '#000000',
            'obsidian-cyber': '#0f172a',
            'solar-amber': '#0c0906'
          };
          var bg = bgMap[t] || '#0c0906';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.backgroundColor = bg;
          if (t === 'alabaster-light') {
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.style.colorScheme = 'dark';
          }
          var d = localStorage.getItem('aetheris_density');
          if (d) document.documentElement.setAttribute('data-density', d);
        } catch (_) {}
      })();
    </script>
