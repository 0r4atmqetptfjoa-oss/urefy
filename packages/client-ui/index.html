      :root {
        --bg-canvas: #08090d;
        --bg-surface-base: #0e1117;

        --text-primary: #f8fafc;

        --spring-snappy: cubic-bezier(0.22, 1, 0.36, 1);
        --spring-fluid: cubic-bezier(0.16, 1, 0.3, 1);
      }
      html, body {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        background-color: var(--bg-canvas, #08090d);
        color-scheme: dark;
        color: var(--text-primary, #f8fafc);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        -webkit-font-smoothing: antialiased;
      }
      html.light, html.light body, [data-theme="alabaster-light"], [data-theme="alabaster-light"] body {
        --bg-canvas: #f6f5f2 !important;
        --bg-surface-base: #ffffff !important;
        --bg-surface-raised: #f1efe9 !important;
        --text-primary: #1a1917 !important;
        background-color: #f6f5f2 !important;
        color-scheme: light !important;
        color: #1a1917 !important;
      }
      [data-theme="mineral-basalt"], [data-theme="mineral-basalt"] body {
        --bg-canvas: #08090d !important;
        --text-primary: #f8fafc !important;
        background-color: #08090d !important;
        color-scheme: dark !important;
      }
      [data-theme="matrix-monolith"], [data-theme="matrix-monolith"] body {
        --bg-canvas: #000000 !important;
        background-color: #000000 !important;
      }
      [data-theme="matrix-emerald"], [data-theme="matrix-emerald"] body {
        --bg-canvas: #020d08 !important;
        background-color: #020d08 !important;
      }
      [data-theme="solar-amber"], [data-theme="solar-amber"] body {
        --bg-canvas: #0c0906 !important;
        background-color: #0c0906 !important;
      }
      [data-theme="tokyo-neon"], [data-theme="tokyo-neon"] body {
        --bg-canvas: #0d0714 !important;
        background-color: #0d0714 !important;
      }
      [data-theme="nordic-frost"], [data-theme="nordic-frost"] body {
        --bg-canvas: #080d16 !important;
        background-color: #080d16 !important;
      }

      /* CRITICAL FIX: Prevent #app and #main-layout from collapsing to 50px height */
      #app {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background-color: transparent;
      }
      #main-layout,
      .app-workspace-shell,
      .sovereign-workspace-grid {
        flex: 1 1 auto !important;
        min-height: calc(100dvh - 3.75rem) !important;
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
      #main-stage,
      #main-feed-scroll,
      main[role="main"] {
        min-height: calc(100dvh - 4.25rem) !important;
        height: auto !important;
        max-height: none !important;
        overflow-y: visible !important;
      }

      #boot-shell { display: none; }
      .app-booting #app { visibility: hidden; }
      html:not(.app-booting) #main-layout { visibility: visible; }
      .app-booting #boot-shell {
        display: block; position: fixed; inset: 0; z-index: 1;
        background: var(--bg-canvas, #08090d); color: #94a3b8;
      }
      .boot-shell__header { height: 64px; padding: 0 24px; display: flex; align-items: center; border-bottom: 1px solid rgba(128,128,128,.15); }
      .boot-shell__brand { color: #38bdf8; font: 700 22px system-ui, sans-serif; }
      .boot-shell__feed { max-width: 680px; margin: 32px auto; padding: 0 20px; }
      .boot-shell__card { height: 170px; margin: 18px 0; padding: 24px; border: 1px solid rgba(128,128,128,.15); border-radius: 20px; box-sizing: border-box; }
      .boot-shell__line { height: 10px; width: 70%; margin: 18px 0; border-radius: 5px; background: rgba(128,128,128,.12); }
      .boot-shell__line:first-child { width: 35%; }
      .public-home-intro {
        margin: 0 0 16px;
        max-width: none;
        padding: 18px 20px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        box-sizing: border-box;
        color: #94a3b8;
        line-height: 1.65;
      }
      .public-home-intro h1 {
        font-size: 18px;
        line-height: 1.4;
        font-weight: 700;
        color: #f8fafc;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      .public-home-intro p {
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.65;
        margin: 0;
      }
      .public-home-intro nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        margin-top: 12px;
        font-size: 12px;
      }
      .public-home-intro a {
        display: inline-flex;
        align-items: center;
        padding: 0;
        background: transparent;
        border: 0;
        color: #38bdf8;
        font-size: 12px;
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: opacity 0.15s ease;
      }
      .public-home-intro a:hover {
        opacity: 0.85;
      }
