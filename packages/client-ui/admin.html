<!DOCTYPE html>
<html lang="en" data-theme="obsidian-cyber">
<head>

<body class="bg-[#070a12] text-slate-100 min-h-screen flex flex-col selection:bg-amber-400/30 selection:text-white">

  <main id="admin-standalone-root" class="flex-1 flex flex-col min-h-screen"></main>
  <script type="module">
    import { adminDashboard } from '/src/admin-dashboard.ts';
    adminDashboard.isOpen = true;
    adminDashboard.renderStandaloneOrModal();
